name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Rebuild weekly so the Writing section picks up new Medium posts
    - cron: '0 2 * * 1'
  workflow_dispatch:

# Least privilege: the build job (which runs npm packages) can only read the repo.
# Only the deploy job gets Pages / OIDC rights.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to full commit SHAs (tags can be moved by an attacker, as in the
# 2026 tag-hijack incidents). The comment after each SHA is the release it points to.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      # Lockfile-exact install with no dependency install scripts (also set in .npmrc)
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
