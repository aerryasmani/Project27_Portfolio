name: E2E

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily check of the live site
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs; the comment is the release each points to.
jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      # Scheduled runs test production; push / PR runs build and test the local site.
      BASE_URL: ${{ github.event_name == 'schedule' && 'https://heiyoaerry.one' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
